[project]
name = "fabrique"
version = "0.14.0"
description = "Fabrique : application de production StudioKids"
requires-python = "==3.12.*"
dependencies = [
    "django>=5.2,<5.3",
    "django-ninja>=1.4",
    "waitress>=3.0",
    "pywebview==6.2.1",  # BSD-3 (pythonnet MIT, clr-loader MIT, bottle MIT, proxy-tools MIT) : la fenêtre WebView2, comme Bramble Studio
    "pystray>=0.19",  # LGPL v3 (six MIT) : l'icône près de l'horloge et ses notifications
    "pillow==13.0.0",  # F1 : celle de Bramble Studio (mêmes pixels pour la miniature et le grain du montage)
]

[dependency-groups]
dev = ["pytest>=9"]

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["fabrique/tests"]
addopts = "-p no:cacheprovider"
