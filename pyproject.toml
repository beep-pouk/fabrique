[project]
name = "fabrique"
version = "0.10.0"
description = "Fabrique : application de production StudioKids"
requires-python = "==3.12.*"
dependencies = [
    "django>=5.2,<5.3",
    "django-ninja>=1.4",
    "waitress>=3.0",
    "PySide6-Essentials>=6.12,<6.13",  # LGPL v3 : bibliothèques livrées à part, non modifiées
    "pillow==13.0.0",  # F1 : celle de Bramble Studio (mêmes pixels pour la miniature et le grain du montage)
    "PySide6-Addons>=6.12,<6.13",  # le lecteur de Vérification (Qt Multimedia, moteur FFmpeg : choix du banc du 16/11) ; LGPL v3, comme Essentials
]

[dependency-groups]
dev = ["pytest>=9", "pytest-qt>=4.5"]

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["fabrique/tests"]
qt_api = "pyside6"
addopts = "-p no:cacheprovider"
